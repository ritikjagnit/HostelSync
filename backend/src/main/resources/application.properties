# ===================================================================
# HostelSync Backend Configuration
# Institution: Government Polytechnic Sakoli
# ===================================================================

# Application Metadata
spring.application.name=hostelsync-backend
info.app.name=HostelSync
info.app.subtitle=Smart Digital Hostel Management System
info.app.institution=Government Polytechnic Sakoli
info.app.version=1.0.0

# Server Configuration
server.port=8080
server.servlet.context-path=/

# ===================================================================
# Database Configuration (H2 File-based for Local Development)
# Persists across restarts in ignored ./data/ directory.
# Overridable via SPRING_DATASOURCE_* environment variables for PostgreSQL in later phases.
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/hostelsyncdb;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Spring Data JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console Configuration (Local Development Only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===================================================================
# JWT Security Configuration
# Secret key is read from JWT_SECRET environment variable in production.
# ===================================================================
jwt.secret=${JWT_SECRET:4a6f7374656c53796e632d476f7665726e6d656e74506f6c79746563686e696353616b6f6c692d5365637572652d4b65792d32303236}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Safe Initial Admin Bootstrap Configuration (Disabled by default)
# Enabled only when explicitly configured with non-blank email and password.
# ===================================================================
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}

# Logging Configuration
logging.level.root=INFO
logging.level.com.hostelsync.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
