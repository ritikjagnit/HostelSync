# ===================================================================
# HostelSync Backend Configuration
# Institution: Government Polytechnic Sakoli
# ===================================================================

# Application Metadata
spring.application.name=hostelsync-backend
info.app.name=HostelSync
info.app.subtitle=Smart Digital Hostel Management System
info.app.institution=Government Polytechnic Sakoli
info.app.version=1.0.0

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://gpsakolihostelsync.pages.dev}

# ===================================================================
# Database Configuration (PostgreSQL Database)
# Supports direct JDBC URL, cloud blueprint parameters (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD),
# and local development defaults (localhost:5432/hostelsyncdb).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostelsyncdb}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}

# Spring Data JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT Security Configuration
# Secret key is read from JWT_SECRET environment variable in production.
# ===================================================================
jwt.secret=${JWT_SECRET:4a6f7374656c53796e632d476f7665726e6d656e74506f6c79746563686e696353616b6f6c692d5365637572652d4b65792d32303236}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Initial Admin Bootstrap Configuration (Enabled for Local Development)
# Automatically creates the initial administrator account if it does not already exist.
# Overridable via BOOTSTRAP_ADMIN_* or APP_BOOTSTRAP_ADMIN_* environment variables.
# ===================================================================
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:${APP_BOOTSTRAP_ADMIN_ENABLED:true}}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:${APP_BOOTSTRAP_ADMIN_EMAIL:admin@gpsakoli.ac.in}}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@123}}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:${APP_BOOTSTRAP_ADMIN_FULL_NAME:Principal Sakoli}}

# Logging Configuration
logging.level.root=INFO
logging.level.com.hostelsync.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
